name: Build Apple packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: iOS simulator and macOS packages
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: src/NetworkStats.App/NetworkStats.App.csproj
      FRAMEWORK_IOS: net10.0-ios
      FRAMEWORK_MAC: net10.0-maccatalyst
      PACKAGES: ${{ github.workspace }}/artifacts/apple-packages
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst

      - name: Build iOS simulator packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGES"

          for rid in iossimulator-arm64 iossimulator-x64; do
            output="$RUNNER_TEMP/$rid"
            dotnet build "$PROJECT" \
              -p:NetworkStatsTargetFramework="$FRAMEWORK_IOS" \
              -f "$FRAMEWORK_IOS" \
              -c Release \
              -r "$rid" \
              -p:EnableCodeSigning=false \
              -p:DebugType=None \
              -p:DebugSymbols=false \
              -o "$output"

            app_path="$(find "$output" -maxdepth 2 -type d -name '*.app' -print -quit)"
            test -n "$app_path"
            architecture="${rid#iossimulator-}"
            ditto -c -k --sequesterRsrc --keepParent "$app_path" \
              "$PACKAGES/Network-Stats-iOS-Simulator-$architecture.zip"
          done

      - name: Build macOS packages
        shell: bash
        run: |
          set -euo pipefail

          for rid in maccatalyst-arm64 maccatalyst-x64; do
            output="$RUNNER_TEMP/$rid"
            dotnet publish "$PROJECT" \
              -p:NetworkStatsTargetFramework="$FRAMEWORK_MAC" \
              -f "$FRAMEWORK_MAC" \
              -c Release \
              -r "$rid" \
              -p:EnableCodeSigning=false \
              -p:CreatePackage=false \
              -p:DebugType=None \
              -p:DebugSymbols=false \
              -o "$output"

            app_path="$(find "$output" -maxdepth 2 -type d -name '*.app' -print -quit)"
            test -n "$app_path"
            codesign --force --deep --sign - "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            architecture="${rid#maccatalyst-}"
            ditto -c -k --sequesterRsrc --keepParent "$app_path" \
              "$PACKAGES/Network-Stats-macOS-$architecture.zip"
          done

      - name: Record checksums
        working-directory: artifacts/apple-packages
        run: shasum -a 256 *.zip > SHA256SUMS-Apple.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: apple-packages-${{ github.run_id }}
          path: artifacts/apple-packages/*
          if-no-files-found: error
          retention-days: 7
